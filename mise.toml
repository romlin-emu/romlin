[tools]
hk = "2.12.0"
pkl = "0.33.0"
# Matches rust-toolchain.toml (stable with rustfmt and clippy).
rust = { version = "stable", components = "rustfmt,clippy" }
# The release checks need Python 3.11+ and Node 22+ (docs/releasing.md).
python = "3.14"
node = "24"
# CLIs called by the `check` task and the hk steps.
"aqua:crate-ci/typos" = "1.52.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"ubi:bnjbvr/cargo-machete" = "0.9.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"

[env]
# macOS only: keeps Homebrew's speexdsp and other pkg-config libraries out of the build.
# See .mise/macos.env. The file is absent on other OSes, which is ignored.
_.file = { path = '.mise/{{os()}}.env', redact = false }
DIST = "dist"
BIN = "target/release"
BUNDLE_ID = "io.github.romlinemu.romlin"
ICON = "crates/romp-app/assets/icon-macos.png"
MOLTENVK = "1.4.1"
MOLTENVK_SHA256 = "5ea0c259df7ded9a275444820f09cced54d6e5a7c7a31d262de62a5cdb7e15cf"
APPIMAGETOOL_VERSION = "1.9.1"
APPIMAGETOOL_SHA256 = "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
# appimagetool otherwise embeds the runtime from type2-runtime's moving "continuous" release.
APPIMAGE_RUNTIME_VERSION = "20251108"
APPIMAGE_RUNTIME_SHA256 = "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
NFPM_VERSION = "2.47.0"
NFPM_SHA256 = "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
# Must equal the slint version in Cargo.lock: the viewer interprets the same .slint files.
SLINT_VIEWER = "1.18.1"
SLINT_VIEWER_LINUX_SHA256 = "86b260e661cdc24dcadaf63266b034f3281cbec542afc26545a72a986fe42a13"
SLINT_VIEWER_MACOS_SHA256 = "e6ced86250e052122b65b593c77c2042a54798428a0f9ae5840f8769f1488571"
# winit loads these when it starts on X11 and panics without them, and minimal installs
# don't have libxkbcommon-x11, so the AppImage brings them. None is on AppImage's excludelist.
LINUX_LIBDIR = "/usr/lib/x86_64-linux-gnu"
APPIMAGE_LIBS = "libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1"
APPIMAGE_LIB_PACKAGES = "libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1"
# The oldest supported Ubuntu LTS has this one; a newer requirement wouldn't start there.
GLIBC_MAX = "2.35"
RCHEEVOS_DIR = "crates/romp-cheevos/rcheevos"
# Only RAIntegration on Windows and external clients use these, and Romlin builds neither.
RCHEEVOS_UNUSED = "src/rc_client_external.c src/rc_client_raintegration.c"
SHA512 = '{% if os() == "macos" %}shasum -a 512{% else %}sha512sum{% endif %}'

# These tasks port the former Makefile. Packaging recipes need bash (Git Bash on Windows).
# Set VERSION to override the Cargo.toml version, as `make VERSION=...` did.

[tasks.check]
description = "Run the same checks as CI"
run = [
  { task = "fmt-check" },
  { task = "clippy" },
  { task = "test" },
  { task = "deny" },
  { task = "machete" },
  { task = "typos" },
  { task = "workflows" },
  { task = "release-check" },
]

[tasks.fmt-check]
run = "cargo fmt --all --check"

[tasks.clippy]
env = { CARGO_INCREMENTAL = "0" }
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
env = { CARGO_INCREMENTAL = "0" }
run = "cargo test --workspace --all-features --locked"

[tasks.deny]
run = "cargo deny --all-features check -D advisory-not-detected"

[tasks.machete]
run = "cargo machete"

[tasks.typos]
run = "typos"

[tasks.workflows]
run = ["actionlint", "zizmor .github"]

[tasks.release-notes]
description = "Print release notes for VERSION (default: the Cargo.toml version)"
quiet = true
shell = "bash -c"
run = '''
version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}
python3 .github/release/release.py notes "${version#v}"
'''

# NODE_PATH points at a temporary install of release-please 17.6.0; see docs/releasing.md.
[tasks.release-check]
run = [
  "python3 -m unittest discover -s .github/release -v",
  "node .github/release/preview.cjs",
]

[tasks.build]
run = "cargo build --release --locked"

[tasks.clean]
run = "rm -rf dist"

[tasks.moltenvk]
description = "Download the pinned MoltenVK"
hide = true
shell = "bash -c"
run = '''
set -eu
tar=target/MoltenVK-$MOLTENVK-macos.tar
[ -f "$tar" ] && exit 0
mkdir -p target
curl -fsSL -o "$tar.tmp" "https://github.com/KhronosGroup/MoltenVK/releases/download/v$MOLTENVK/MoltenVK-macos.tar"
echo "$MOLTENVK_SHA256  $tar.tmp" | shasum -a 256 -c -
mv "$tar.tmp" "$tar"
'''

[tasks.appimagetool]
description = "Download the pinned appimagetool"
hide = true
shell = "bash -c"
run = '''
set -eu
tool=target/appimagetool-$APPIMAGETOOL_VERSION-x86_64.AppImage
[ -f "$tool" ] && exit 0
mkdir -p target
curl -fsSL -o "$tool.tmp" "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
echo "$APPIMAGETOOL_SHA256  $tool.tmp" | sha256sum -c -
chmod +x "$tool.tmp"
mv "$tool.tmp" "$tool"
'''

[tasks.appimage-runtime]
description = "Download the pinned AppImage runtime"
hide = true
shell = "bash -c"
run = '''
set -eu
runtime=target/appimage-runtime-$APPIMAGE_RUNTIME_VERSION-x86_64
[ -f "$runtime" ] && exit 0
mkdir -p target
curl -fsSL -o "$runtime.tmp" "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
echo "$APPIMAGE_RUNTIME_SHA256  $runtime.tmp" | sha256sum -c -
mv "$runtime.tmp" "$runtime"
'''

[tasks.nfpm]
description = "Download the pinned nfpm"
hide = true
shell = "bash -c"
run = '''
set -eu
nfpm=target/nfpm-$NFPM_VERSION
[ -f "$nfpm" ] && exit 0
mkdir -p target
curl -fsSL -o "$nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
echo "$NFPM_SHA256  $nfpm.tar.gz" | sha256sum -c -
tar -xzOf "$nfpm.tar.gz" nfpm > "$nfpm.tmp"
rm "$nfpm.tar.gz"
chmod +x "$nfpm.tmp"
mv "$nfpm.tmp" "$nfpm"
'''

# ui-shots runs this; it isn't in [tools], so CI and release builds never fetch it.
[tasks.slint-viewer]
description = "Download the pinned slint-viewer"
hide = true
quiet = true
shell = "bash -c"
run = '''
set -eu
locked=$(grep -A 1 '^name = "slint"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
if [ "$locked" != "$SLINT_VIEWER" ]; then
  echo "SLINT_VIEWER is $SLINT_VIEWER but Cargo.lock has slint $locked; change them together" >&2
  exit 1
fi
dir=dist/tools/slint-viewer-$SLINT_VIEWER
[ -f "$dir/slint-viewer" ] && exit 0
case "$(uname -s)/$(uname -m)" in
  Linux/x86_64) asset=linux sum=$SLINT_VIEWER_LINUX_SHA256 check="sha256sum -c -" ;;
  Darwin/*) asset=macos sum=$SLINT_VIEWER_MACOS_SHA256 check="shasum -a 256 -c -" ;;
  *) echo "slint-viewer: no pinned build for $(uname -s) $(uname -m)" >&2; exit 1 ;;
esac
mkdir -p dist/tools
rm -rf "$dir.tmp" "$dir.tar.gz"
curl -fsSL -o "$dir.tar.gz" "https://github.com/slint-ui/slint/releases/download/v$SLINT_VIEWER/slint-viewer-$asset.tar.gz"
echo "$sum  $dir.tar.gz" | $check
mkdir "$dir.tmp"
tar -xzf "$dir.tar.gz" -C "$dir.tmp" --strip-components 1
rm "$dir.tar.gz"
mv "$dir.tmp" "$dir"
'''

# Fixtures are crates/romp-app/ui/fixtures/<Component>/<name>.json, read by slint-viewer --load-data.
[tasks.ui-shots]
description = "Render the UI fixtures to PNG images without building the app"
quiet = true
depends = ["slint-viewer"]
shell = "bash -c"
usage = 'arg "[fixture]" help="Fixture name without .json (default: every fixture)"'
run = '''
set -u
viewer=$PWD/dist/tools/slint-viewer-$SLINT_VIEWER/slint-viewer
out=$PWD/dist/ui-shots
size=${SIZE:-1280x800}
name=${usage_fixture:-}
cd crates/romp-app/ui
shopt -s nullglob
if [ -n "$name" ]; then fixtures=(fixtures/*/"$name".json); else fixtures=(fixtures/*/*.json); fi
if [ -z "${fixtures[0]-}" ]; then
  echo "no fixture named '$name' in crates/romp-app/ui/fixtures" >&2
  exit 1
fi
failed=0
for fixture in "${fixtures[@]}"; do
  component=${fixture#fixtures/}
  component=${component%%/*}
  png=$out/$component/$(basename "$fixture" .json).png
  mkdir -p "$out/$component"
  rm -f "$png"
  # The viewer exits 0 when a fixture names a missing property or a value doesn't convert.
  status=0
  log=$(env -u SLINT_BACKEND "$viewer" --style fluent-dark --component "$component" \
    --load-data "$fixture" --size "$size" --screenshot "$png" main.slint 2>&1 >/dev/null) || status=$?
  [ -n "$log" ] && printf '%s\n' "$log" >&2
  if [ "$status" -ne 0 ] || [ ! -f "$png" ] \
    || grep -qE '^Warning: (ignoring unknown property|cannot set property)' <<<"$log"; then
    echo "failed: $fixture" >&2
    failed=1
  else
    echo "$png"
  fi
done
exit "$failed"
'''

[tasks.app]
description = "Build the macOS app bundle"
depends = ["build", "moltenvk"]
shell = "bash -c"
run = '''
set -eu
cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
app=dist/Romlin.app
iconset=dist/Romlin.iconset
tar=target/MoltenVK-$MOLTENVK-macos.tar
rm -rf "$app" "$iconset"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources" "$iconset"
cp "$BIN/romlin" "$BIN/romlin-runner" "$app/Contents/MacOS/"
tar -xOf "$tar" MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib > "$app/Contents/Frameworks/libMoltenVK.dylib"
lipo -thin arm64 -output "$app/Contents/Frameworks/libMoltenVK.dylib" "$app/Contents/Frameworks/libMoltenVK.dylib"
cp LICENSE "$app/Contents/Resources/"
cp -R crates/romp-app/shaders "$app/Contents/Resources/"
tar -xOf "$tar" MoltenVK/LICENSE > "$app/Contents/Resources/MoltenVK-LICENSE"
sed -e "s/@VERSION@/$cargo_version/g" -e "s/@BUNDLE_ID@/$BUNDLE_ID/g" \
  packaging/macos/Info.plist > "$app/Contents/Info.plist"
for size in 16 32 128 256 512; do
  sips -z $size $size "$ICON" --out "$iconset/icon_${size}x${size}.png" >/dev/null &&
  sips -z $((size * 2)) $((size * 2)) "$ICON" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null || exit 1
done
iconutil --convert icns --output "$app/Contents/Resources/Romlin.icns" "$iconset"
rm -rf "$iconset"
codesign --force --sign - "$app/Contents/Frameworks/libMoltenVK.dylib"
codesign --force --sign - "$app/Contents/MacOS/romlin-runner"
codesign --force --sign - "$app"
'''

[tasks.dist]
description = "Package the app for this platform"
run = "mise run dist-{{os()}}"

[tasks.dist-macos]
depends = ["app"]
shell = "bash -c"
run = '''
set -eu
version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}
name=Romlin-${version#v}-macos-$(uname -m).zip
rm -f "dist/$name"
ditto -c -k --keepParent dist/Romlin.app "dist/$name"
(cd dist && $SHA512 "$name" > "$name.sha512")
'''

[tasks.appimage]
depends = ["build", "appimagetool", "appimage-runtime"]
shell = "bash -c"
run = '''
set -eu
version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}
arch=$(uname -m)
name=Romlin-${version#v}-$arch.AppImage
appdir=dist/Romlin.AppDir
rm -rf "$appdir" "dist/$name"
mkdir -p "$appdir/usr/bin" "$appdir/usr/lib" "$appdir/usr/share/applications" "$appdir/usr/share/metainfo" "$appdir/usr/share/icons/hicolor/256x256/apps"
cp "$BIN/romlin" "$BIN/romlin-runner" "$appdir/usr/bin/"
cp -R crates/romp-app/shaders "$appdir/usr/bin/"
cp packaging/linux/romlin.desktop "$appdir/"
cp packaging/linux/romlin.desktop "$appdir/usr/share/applications/"
cp "packaging/linux/$BUNDLE_ID.metainfo.xml" "$appdir/usr/share/metainfo/"
appstreamcli validate --no-net "$appdir/usr/share/metainfo/$BUNDLE_ID.metainfo.xml"
cp packaging/linux/romlin.png "$appdir/"
cp packaging/linux/romlin.png "$appdir/usr/share/icons/hicolor/256x256/apps/"
for lib in $APPIMAGE_LIBS; do cp -L "$LINUX_LIBDIR/$lib" "$appdir/usr/lib/"; done
patchelf --set-rpath '$ORIGIN/../lib' "$appdir/usr/bin/romlin"
for lib in $APPIMAGE_LIBS; do patchelf --set-rpath '$ORIGIN' "$appdir/usr/lib/$lib"; done
for pkg in $APPIMAGE_LIB_PACKAGES; do
  mkdir -p "$appdir/usr/share/doc/$pkg" && cp "/usr/share/doc/$pkg/copyright" "$appdir/usr/share/doc/$pkg/" || exit 1
done
ln -s usr/bin/romlin "$appdir/AppRun"
ARCH=$arch "target/appimagetool-$APPIMAGETOOL_VERSION-x86_64.AppImage" --runtime-file "target/appimage-runtime-$APPIMAGE_RUNTIME_VERSION-x86_64" "$appdir" "dist/$name"
rm -rf "$appdir"
(cd dist && $SHA512 "$name" > "$name.sha512")
'''

[tasks.packages]
description = "Build the .deb and .rpm"
depends = ["build", "nfpm"]
shell = "bash -c"
run = '''
set -eu
cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
version=${VERSION:-$cargo_version}
package=Romlin-${version#v}-$(uname -m)
for packager in deb rpm; do
  ROMLIN_VERSION=$cargo_version "target/nfpm-$NFPM_VERSION" package --config packaging/linux/nfpm.yaml \
    --packager $packager --target "dist/$package.$packager" || exit 1
  (cd dist && $SHA512 "$package.$packager" > "$package.$packager.sha512") || exit 1
done
'''

[tasks.glibc-check]
description = "Check the glibc the Linux binaries need"
shell = "bash -c"
run = '''
for bin in "$BIN/romlin" "$BIN/romlin-runner"; do
  need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
  echo "$bin needs glibc $need"
  [ "$(printf '%s\n' "$need" "$GLIBC_MAX" | sort -V | tail -n 1)" = "$GLIBC_MAX" ] || { echo "that's newer than $GLIBC_MAX"; exit 1; }
done
'''

[tasks.linux-archive]
description = "Bundle the Linux tarball"
hide = true
shell = "bash -c"
run = '''
set -eu
version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}
name=Romlin-${version#v}-linux-$(uname -m)
rm -rf "dist/$name" "dist/$name.tar.gz"
mkdir -p "dist/$name"
cp "$BIN/romlin" "$BIN/romlin-runner" README.md LICENSE "dist/$name/"
cp -R crates/romp-app/shaders "dist/$name/"
tar -czf "dist/$name.tar.gz" -C dist "$name"
rm -rf "dist/$name"
(cd dist && $SHA512 "$name.tar.gz" > "$name.tar.gz.sha512")
'''

[tasks.dist-linux]
run = [{ task = "appimage" }, { task = "packages" }, { task = "linux-archive" }]

[tasks.dist-windows]
depends = ["build"]
shell = "bash -c"
run = '''
set -eu
version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}
name=Romlin-${version#v}-windows-$(uname -m)
rm -rf "dist/$name" "dist/$name.zip"
mkdir -p "dist/$name"
cp "$BIN/romlin.exe" "$BIN/romlin-runner.exe" README.md LICENSE "dist/$name/"
cp -R crates/romp-app/shaders "dist/$name/"
(cd dist && 7z a -bso0 "$name.zip" "$name")
rm -rf "dist/$name"
(cd dist && $SHA512 "$name.zip" > "$name.zip.sha512")
'''

# Replaces the bundled rcheevos with a release: the latest, or RCHEEVOS=v12.5.0.
[tasks.update-rcheevos]
shell = "bash -c"
run = '''
set -eu
tag=${RCHEEVOS:-}
if [ -z "$tag" ]; then
  tag=$(curl -fsSL https://api.github.com/repos/RetroAchievements/rcheevos/releases/latest \
    | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
fi
test -n "$tag"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
curl -fsSL "https://github.com/RetroAchievements/rcheevos/archive/refs/tags/$tag.tar.gz" \
  | tar -xz -C "$tmp" --strip-components 1
rm -rf "$RCHEEVOS_DIR/include" "$RCHEEVOS_DIR/src"
cp -R "$tmp/include" "$tmp/src" "$tmp/LICENSE" "$RCHEEVOS_DIR/"
for f in $RCHEEVOS_UNUSED; do rm -f "$RCHEEVOS_DIR/$f"; done
echo "$tag" > "$RCHEEVOS_DIR/VERSION"
echo "rcheevos is now $tag. Changes: https://github.com/RetroAchievements/rcheevos/releases/tag/$tag"
'''

[tasks."hooks:check"]
description = "Run hk checks on all files"
run = "hk check --all"

[tasks.fix]
description = "Apply hk fixes to all files"
run = "hk fix --all"
