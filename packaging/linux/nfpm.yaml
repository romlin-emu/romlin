# The .deb and .rpm, built by `make packages` from the release binaries. Romlin finds romlin-runner
# and its shaders beside the program, so everything goes in /opt/romlin and the command links there.
name: romlin
arch: amd64
platform: linux
version: ${ROMLIN_VERSION}
section: games
maintainer: Romlin contributors
description: Play retro games from your RomM library, with each game running in its own sandboxed process.
homepage: https://romlin-emu.github.io
license: GPL-3.0-or-later

contents:
  - src: target/release/romlin
    dst: /opt/romlin/romlin
    file_info:
      mode: 0755
  - src: target/release/romlin-runner
    dst: /opt/romlin/romlin-runner
    file_info:
      mode: 0755
  - src: crates/romp-app/shaders
    dst: /opt/romlin/shaders
    type: tree
  # Tells Romlin's update check which download replaces it.
  - src: packaging/linux/package/deb
    dst: /opt/romlin/package
    packager: deb
  - src: packaging/linux/package/rpm
    dst: /opt/romlin/package
    packager: rpm
  - src: /opt/romlin/romlin
    dst: /usr/bin/romlin
    type: symlink
  - src: packaging/linux/romlin.desktop
    dst: /usr/share/applications/romlin.desktop
  - src: packaging/linux/romlin.png
    dst: /usr/share/icons/hicolor/256x256/apps/romlin.png
  - src: packaging/linux/io.github.romlinemu.romlin.metainfo.xml
    dst: /usr/share/metainfo/io.github.romlinemu.romlin.metainfo.xml
  - src: LICENSE
    dst: /usr/share/doc/romlin/LICENSE

# What Romlin links to, and what winit loads when it opens a window on X11 or Wayland. Sound and
# Vulkan are only recommended: a game still plays without them.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libstdc++6
      - libfontconfig1
      - libudev1
      - libegl1
      - libgl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrender1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-egl1
    recommends:
      - libpulse0 | libasound2
      - libvulkan1
  # By library rather than package name, so the names don't tie it to one distribution.
  rpm:
    depends:
      - libc.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libstdc++.so.6()(64bit)
      - libfontconfig.so.1()(64bit)
      - libudev.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrender.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
    recommends:
      - libpulse.so.0()(64bit)
      - libvulkan.so.1()(64bit)

rpm:
  group: Amusements/Games
