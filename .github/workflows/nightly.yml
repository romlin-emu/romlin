name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: nightly

  publish:
    if: github.ref == 'refs/heads/main'
    # Build/check every push; only the rolling release replacement is serialized.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: romlin-*
          path: dist
          merge-multiple: true
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping a nightly superseded by main at $main_sha"
            exit 0
          fi
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "Latest build of main, from ${GITHUB_SHA::7}. Not signed or notarized: the first time, on macOS right-click Romlin and choose Open, and on Windows choose More info, then Run anyway."
