name: Nightly

on:
  push:
    branches: [main]
    # Documentation alone changes nothing CI checks.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:

permissions: {}

jobs:
  # A newer push supersedes this nightly: cancel its checks and builds, which
  # also skips its publication. Publication itself is never cancelled midway.
  ci:
    concurrency:
      group: nightly-ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  build:
    concurrency:
      group: nightly-build-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: nightly

  publish:
    if: github.ref == 'refs/heads/main'
    # Build/check every push; only the rolling release replacement is serialized.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags let cocogitto diff the newest reachable release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: romlin-*
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cocogitto
      - name: Generate the changelog
        run: |
          base=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1)
          if [ -n "$base" ]; then
            cog changelog "$base.." > changelog.md
          else
            cog changelog > changelog.md
          fi
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping a nightly superseded by main at $main_sha"
            exit 0
          fi
          {
            echo "Latest build of main, from ${GITHUB_SHA::7}. Not signed or notarized: the first time, on macOS right-click Romlin and choose Open, and on Windows choose More info, then Run anyway."
            echo
            cat changelog.md
          } > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes-file notes.md
