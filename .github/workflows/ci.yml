name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  pull_request:
    # Documentation alone changes nothing CI checks.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, dependencies, spelling and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      # mise.toml pins the Rust, lint, Python and Node tools these checks use.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
      # Exact release-please version matches the pinned release action; test-only temporary install.
      - name: Install release preview dependency
        run: npm install --prefix "$RUNNER_TEMP/release-preview" --ignore-scripts --no-audit --no-fund release-please@17.6.0 # zizmor: ignore[adhoc-packages]
      - run: "mise run fmt-check ::: deny ::: machete ::: typos ::: workflows ::: release-check"
        env:
          NODE_PATH: ${{ runner.temp }}/release-preview/node_modules
      - name: Check SteamOS installer
        run: python3 -m unittest discover -s packaging/steamos -v

  check:
    name: Clippy and tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libegl-dev libfontconfig1-dev libpulse-dev libudev-dev libwayland-dev libxkbcommon-dev
      # The tasks run cargo under mise's environment (.mise/macos.env keeps Homebrew libraries out).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
      - name: Clippy
        run: mise run clippy
      - name: Tests
        run: mise run test
