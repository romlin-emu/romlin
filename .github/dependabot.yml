version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Romlin hands glow types to librashader, so glow moves only when librashader does.
      - dependency-name: glow
        update-types: [version-update:semver-major, version-update:semver-minor]
    cooldown:
      default-days: 7
    groups:
      crates:
        update-types: [minor, patch]
      crates-breaking:
        update-types: [major]
